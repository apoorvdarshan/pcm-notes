# Dependabot version updates. Dependabot alerts are enabled in the repository
# settings and report vulnerable dependencies as soon as they are known; this
# file adds routine version bumps so the pinned versions (including the
# commit-SHA-pinned GitHub Actions) do not go stale.
#
# Monthly and grouped into one pull request per ecosystem and directory: a Swift
# package bump, or a GitHub Actions bump that touches ios-tests.yml, runs the iOS
# unit and UI tests on a macOS runner, once on the pull request and again on main.
# The one exception is the store-release pins, which get a PR of their own (below).

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      # The release callers' pins (one SHA in ios-release.yml and store-checks.yml,
      # with its "# vX.Y.Z" comment). Declared before the catch-all: a dependency
      # joins the first group it matches, so a store-release bump always gets its
      # own PR.
      store-release:
        patterns: ["apoorvdarshan/store-release*"]
      github-actions:
        patterns: ["*"]
    # store-release pins run with the app's signing and App Store Connect
    # credentials: a new release waits seven days before Dependabot proposes it.
    # Security updates are never delayed by a cooldown.
    cooldown:
      default-days: 7
      include: ["apoorvdarshan/store-release*"]

  # The App Store Connect tooling and its hash-locked Python dependencies live in
  # apoorvdarshan/store-release, which keeps them up to date; the store-release
  # group above moves this repository to each new release.

  # The hash-pinned Atheris that the Fuzzing workflow installs (fuzz/requirements.txt).
  - package-ecosystem: pip
    directory: /fuzz
    schedule:
      interval: monthly
    groups:
      fuzz-tooling:
        patterns: ["*"]

  # RevenueCat, pinned in the Xcode project's Package.resolved.
  - package-ecosystem: swift
    directory: /ios/PCMNotes
    schedule:
      interval: monthly
    groups:
      swift-packages:
        patterns: ["*"]

  # Website build and deploy tooling (sharp, wrangler) in the root package.json.
  # No workflow builds the website, so check these locally with `npm run build`.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      website-tooling:
        patterns: ["*"]
