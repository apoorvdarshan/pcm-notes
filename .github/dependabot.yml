# Dependabot version updates. Dependabot alerts are enabled in the repository
# settings and report vulnerable dependencies as soon as they are known; this
# file adds routine version bumps so the pinned versions (including the
# commit-SHA-pinned GitHub Actions) do not go stale.
#
# Monthly and grouped into one pull request per ecosystem and directory: a Swift
# package bump, or a GitHub Actions bump that touches ios-tests.yml, runs the iOS
# unit and UI tests on a macOS runner, once on the pull request and again on main.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]

  # The hash-pinned App Store Connect tooling (requirements-store.txt, compiled
  # from requirements-store.in) that the release and store-check jobs install.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    groups:
      store-tooling:
        patterns: ["*"]

  # The hash-pinned Atheris that the Fuzzing workflow installs (fuzz/requirements.txt).
  - package-ecosystem: pip
    directory: /fuzz
    schedule:
      interval: monthly
    groups:
      fuzz-tooling:
        patterns: ["*"]

  # RevenueCat, pinned in the Xcode project's Package.resolved.
  - package-ecosystem: swift
    directory: /ios/PCMNotes
    schedule:
      interval: monthly
    groups:
      swift-packages:
        patterns: ["*"]

  # Website build and deploy tooling (sharp, wrangler) in the root package.json.
  # No workflow builds the website, so check these locally with `npm run build`.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      website-tooling:
        patterns: ["*"]
