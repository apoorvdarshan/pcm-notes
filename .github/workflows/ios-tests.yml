# iOS tests: the PCMNotesTests unit tests and PCMNotesUITests UI tests on iOS
# simulators (Debug, unsigned). Never archives, signs, uploads or calls App Store
# Connect. The iOS Release workflow also calls it before uploading a build.
name: iOS tests

on:
  pull_request:
    paths:
      - 'ios/**'
      # The app bundles one PDF per chapter, generated from these note images.
      - 'catalog.json'
      - 'physics/**'
      - 'chemistry/**'
      - 'mathematics/**'
      - 'scripts/test-ios.sh'
      - 'scripts/ios_test_summary.py'
      - 'scripts/test_ios_test_summary.py'
      - '.github/workflows/ios-tests.yml'
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - 'catalog.json'
      - 'physics/**'
      - 'chemistry/**'
      - 'mathematics/**'
      - 'scripts/test-ios.sh'
      - 'scripts/ios_test_summary.py'
      - 'scripts/test_ios_test_summary.py'
      - '.github/workflows/ios-tests.yml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# A newer push to a pull request supersedes its older run. Pushes to main, manual
# runs and release callers each keep their own run and are never cancelled.
concurrency:
  group: ios-tests-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ios-tests:
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
      IOS_TEST_PACKAGES: ${{ github.workspace }}/.ios-test-packages
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          # The website and marketing images are not needed; the note images are.
          sparse-checkout: |
            /ios/
            /catalog.json
            /physics/
            /chemistry/
            /mathematics/
            /scripts/test-ios.sh
            /scripts/ios_test_summary.py
            /scripts/test_ios_test_summary.py

      - name: Test the result checker
        run: python3 -m unittest scripts/test_ios_test_summary.py

      - name: Cache pinned Swift packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ios-test-packages
          key: ios-spm-${{ runner.os }}-${{ runner.arch }}-xcode27-${{ hashFiles('ios/**/Package.resolved') }}

      - name: Build and run unit and UI tests
        env:
          IOS_TEST_RESULTS: ${{ runner.temp }}/ios-test-results
          IOS_TEST_DERIVED_DATA: ${{ runner.temp }}/ios-test-build
        run: bash scripts/test-ios.sh

      - name: Retain test results and failure screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-test-results-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ios-test-results
          if-no-files-found: warn
          retention-days: 7
