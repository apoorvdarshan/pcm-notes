# OpenSSF Scorecard: checks the repository's security practices (branch protection,
# pinned dependencies, token permissions, SAST, fuzzing and more), publishes the
# results to https://scorecard.dev/viewer/?uri=github.com/apoorvdarshan/pcm-notes for
# the README badge, and uploads the findings to code scanning.
name: OpenSSF Scorecard

on:
  push:
    # Scorecard only supports the default branch.
    branches: [main]
  schedule:
    # Weekly on Saturdays.
    - cron: '30 1 * * 6'
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write # upload SARIF to code scanning
      id-token: write # publish the results (publish_results: true)
    steps:
      # Scorecard analyses the repository through the GitHub API, so only the
      # workflows are checked out, not the note images.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Keep the SARIF file
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results.sarif
