# Static analysis (SAST) of the Swift app with GitHub CodeQL's security and quality
# queries. CodeQL analyses the Swift it sees being compiled, so this builds the app
# (Debug, iOS Simulator, unsigned) under CodeQL on a macOS runner, including the
# offline-notes generator in ios/PCMNotes/BuildTools/. It never restores a build
# cache, so every source file is compiled and analysed. The macOS build is too slow
# for every pull request, so it runs weekly, for each release tag and by hand;
# codeql.yml still analyses the Python, JavaScript and workflows on every pull
# request.
#
# It runs on an Intel (x64) runner with Xcode 26.6, the oldest Xcode the app
# supports. On the Apple silicon xcode-27 runner, CodeQL's build tracer stops the
# Swift compiler from starting its macro plugins (@TaskLocal, SwiftUI's @State)
# and Swift Package Manager's sandbox ("Bad CPU type in executable").
name: CodeQL Swift

on:
  # Release tags (the same v* tags ios-release.yml ships), so every release is analyzed.
  push:
    tags:
      - "v*"
  schedule:
    # Weekly on Mondays.
    - cron: '41 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (swift)
    runs-on: macos-26-intel
    timeout-minutes: 120
    permissions:
      contents: read
      security-events: write # upload results to code scanning
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          # The app build turns these note images into the bundled chapter PDFs.
          sparse-checkout: |
            /ios/
            /physics/
            /chemistry/
            /mathematics/

      # Swift Package Manager evaluates package manifests inside sandbox-exec, which
      # cannot start under CodeQL's build tracer ("Bad CPU type in executable"), even
      # when the build only reloads already-resolved packages. On this throwaway
      # runner, turn that manifest sandbox off for Xcode, and resolve the pinned
      # packages before tracing starts; the traced build reuses them.
      - name: Resolve the pinned Swift packages
        run: |
          defaults write com.apple.dt.Xcode IDEPackageSupportDisableManifestSandbox -bool YES
          defaults write com.apple.dt.Xcode IDEPackageSupportDisablePluginExecutionSandbox -bool YES
          xcodebuild -version
          xcodebuild -resolvePackageDependencies \
            -project ios/PCMNotes/PCMNotes.xcodeproj \
            -scheme PCMNotes \
            -derivedDataPath "$RUNNER_TEMP/codeql-build" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/codeql-packages" \
            -onlyUsePackageVersionsFromResolvedFile

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: swift
          build-mode: manual
          queries: security-and-quality

      - name: Build the app under CodeQL
        run: |
          xcodebuild build \
            -project ios/PCMNotes/PCMNotes.xcodeproj \
            -scheme PCMNotes \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/codeql-build" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/codeql-packages" \
            -disableAutomaticPackageResolution \
            -skipPackageUpdates \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: /language:swift
